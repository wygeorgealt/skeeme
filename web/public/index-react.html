<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeeme</title>
    <meta name="description" content="Skeeme — AI study companion for students. Snap questions, generate quizzes, revise with flashcards, and build study streaks." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              serif: ["Georgia", "Times New Roman", "serif"],
            },
            boxShadow: {
              glow: "0 0 30px rgba(96, 165, 250, 0.25)",
            },
          },
        },
      };
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { background: #050b17; color: #f3f4f6; }
      .mask-fade {
        -webkit-mask-image: linear-gradient(90deg, transparent, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, transparent);
        mask-image: linear-gradient(90deg, transparent, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 92%, transparent);
      }
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee { animation: marquee 30s linear infinite; }
    </style>
  </head>
  <body class="bg-[#050b17] text-white antialiased">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      const navItems = [
        { label: 'About', id: 'about' },
        { label: 'Features', id: 'features' },
        { label: 'FAQ', id: 'faq' },
        { label: 'Contact', id: 'contact' },
      ];

      const faqData = [
        { question: 'Is my study data safe and private?', answer: 'Yes. Skeeme protects your notes, questions, and revision history with secure access controls and privacy-first design so your study data stays yours.' },
        { question: 'Can I use Skeeme with my notes, slides, and PDFs?', answer: 'Absolutely. You can upload the materials you already have and let Skeeme turn them into quizzes, flashcards, and guided explanations based on what you actually need to learn.' },
        { question: 'How quickly can I start studying smarter?', answer: 'Very quickly. In minutes, you can snap a question, upload class content, or generate a custom quiz and start learning with instant feedback.' },
        { question: 'Is Skeeme built for exam prep?', answer: 'Yes. It is designed for revision-heavy study workflows, helping you build streaks, revisit weak areas, and turn class content into active recall practice before tests and exams.' },
        { question: 'Does it help with difficult questions and explanations?', answer: 'Yes. Skeeme breaks down tough concepts step by step, explains the reasoning clearly, and turns each question into learning material you can reuse later.' },
      ];

      const marqueeBrands = [
        { name: 'Springfield', hue: 'from-violet-500 to-indigo-500' },
        { name: 'Orbitc', hue: 'from-cyan-500 to-blue-500' },
        { name: 'Cloud', hue: 'from-emerald-500 to-teal-500' },
        { name: 'Amster', hue: 'from-amber-500 to-orange-500' },
        { name: 'Nexus', hue: 'from-pink-500 to-rose-500' },
      ];

      const FadeInUp = ({ children, className = '', delay = 0 }) => {
        const ref = React.useRef(null);
        const [visible, setVisible] = React.useState(false);

        React.useEffect(() => {
          const node = ref.current;
          if (!node) return undefined;
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          }, { threshold: 0.15 });
          observer.observe(node);
          return () => observer.disconnect();
        }, []);

        return (
          <div
            ref={ref}
            className={`${className} transition-all duration-1000 ease-out ${visible ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'}`}
            style={{ transitionDelay: `${delay}ms` }}
          >
            {children}
          </div>
        );
      };

      function LogoMark() {
        return (
          <svg viewBox="0 0 120 120" className="h-8 w-8 text-white" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 20V92C18 99.732 24.268 106 32 106H40V64H68V42H40V20H18ZM68 42H88C95.732 42 102 48.268 102 56V92C102 99.732 95.732 106 88 106H68V42Z" stroke="currentColor" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        );
      }

      function BrandLogo({ name, gradient }) {
        return (
          <div className="flex shrink-0 items-center gap-3 px-8 text-sm font-medium text-gray-400">
            <div className={`h-7 w-7 rounded-lg bg-gradient-to-br ${gradient} p-[1px]`}>
              <div className="flex h-full w-full items-center justify-center rounded-[7px] bg-[#0b1320] text-[10px] font-bold text-white">
                {name.slice(0, 2).toUpperCase()}
              </div>
            </div>
            <span>{name}</span>
          </div>
        );
      }

      function App() {
        const [isScrolled, setIsScrolled] = useState(false);
        const [mobileOpen, setMobileOpen] = useState(false);
        const [activeFaq, setActiveFaq] = useState(0);

        const repeatedBrands = useMemo(() => [...marqueeBrands, ...marqueeBrands, ...marqueeBrands, ...marqueeBrands], []);

        useEffect(() => {
          const onScroll = () => setIsScrolled(window.scrollY > 20);
          onScroll();
          window.addEventListener('scroll', onScroll, { passive: true });
          return () => window.removeEventListener('scroll', onScroll);
        }, []);

        const scrollToSection = (id) => {
          const element = document.getElementById(id);
          if (element) {
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };

        return (
          <div className="min-h-screen overflow-x-hidden bg-[#050b17] text-white">
            <header className={`fixed inset-x-0 top-0 z-50 transition-all duration-500 ${isScrolled ? 'bg-black/80 backdrop-blur-md' : 'bg-transparent'}`}>
              <div className="mx-auto max-w-7xl px-6">
                <div className={`mt-5 flex items-center justify-between rounded-full border border-white/10 px-4 py-3 transition-all duration-300 ${isScrolled ? 'bg-[#0b1320]/80' : 'bg-transparent'}`}>
                  <button type="button" onClick={() => scrollToSection('about')} className="flex items-center gap-3">
                    <LogoMark />
                    <span className="text-lg font-semibold tracking-tight text-white">Skeeme</span>
                  </button>

                  <nav className="hidden items-center gap-8 md:flex">
                    {navItems.map((item) => (
                      <button key={item.id} type="button" onClick={() => scrollToSection(item.id)} className="text-sm font-medium text-gray-300 transition-colors hover:text-white">
                        {item.label}
                      </button>
                    ))}
                  </nav>

                  <div className="hidden md:block">
                    <button type="button" onClick={() => scrollToSection('contact')} className="rounded-full border border-white/5 bg-[#1F1F22] px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-[#2A2A2D]">
                      Get started
                    </button>
                  </div>

                  <button type="button" aria-label="Toggle menu" aria-expanded={mobileOpen} onClick={() => setMobileOpen((value) => !value)} className="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-white/5 text-lg text-white md:hidden">
                    {mobileOpen ? '×' : '☰'}
                  </button>
                </div>

                <div className={`overflow-hidden transition-all duration-300 md:hidden ${mobileOpen ? 'max-h-80 opacity-100' : 'max-h-0 opacity-0'}`}>
                  <div className="mt-2 rounded-2xl border border-white/10 bg-black/60 p-3 backdrop-blur-md">
                    {navItems.map((item) => (
                      <button key={item.id} type="button" onClick={() => { scrollToSection(item.id); setMobileOpen(false); }} className="block w-full rounded-xl px-3 py-2 text-left text-sm text-gray-200 transition-colors hover:bg-white/5 hover:text-white">
                        {item.label}
                      </button>
                    ))}
                    <button type="button" onClick={() => { scrollToSection('contact'); setMobileOpen(false); }} className="mt-2 w-full rounded-full bg-[#1F1F22] px-4 py-2.5 text-sm font-medium text-white">
                      Get started
                    </button>
                  </div>
                </div>
              </div>
            </header>

            <main>
              <section id="about" className="relative z-0 min-h-screen pt-32 pb-20">
                <video autoPlay muted loop playsInline className="absolute inset-0 -z-10 h-full w-full object-cover opacity-90">
                  <source src="https://cdn.sceneai.art/Hero%20Section%20Video/50b4f304-cdca-4e12-8735-580d225834be.mp4" type="video/mp4" />
                </video>
                <div className="absolute inset-0 -z-10 bg-gradient-to-b from-black/30 via-transparent to-black" />

                <div className="mx-auto max-w-7xl px-6">
                  <FadeInUp className="flex justify-center">
                    <div className="mb-8 inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-gray-300 backdrop-blur-sm">
                      <span>✨</span>
                      <span>AI study companion for students</span>
                    </div>
                  </FadeInUp>

                  <FadeInUp className="text-center">
                    <h1 className="text-5xl font-medium tracking-tight text-white md:text-7xl">
                      <span className="block">Study smarter.</span>
                      <span className="block text-white/95">Score <span className="font-serif italic font-normal text-white/95">higher.</span></span>
                    </h1>
                  </FadeInUp>

                  <FadeInUp delay={80} className="mt-6 flex justify-center">
                    <p className="max-w-2xl text-center text-[16px] leading-8 text-gray-400">
                      Snap questions, solve with AI, generate quizzes, revise with flashcards, and build study streaks.
                      Everything you need to learn faster and stay ahead of your exams.
                    </p>
                  </FadeInUp>

                  <FadeInUp delay={160} className="mt-10 flex justify-center gap-4">
                    <button type="button" onClick={() => scrollToSection('contact')} className="rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition hover:scale-[1.01]">Get started</button>
                    <button type="button" onClick={() => scrollToSection('features')} className="rounded-full border border-white/5 bg-[#1F1F22] px-6 py-3 text-sm font-medium text-white transition-colors hover:bg-[#2A2A2D]">Learn more</button>
                  </FadeInUp>

                  <FadeInUp delay={240} className="mt-24">
                    <div className="mb-8 text-center text-sm font-medium text-gray-500">Trusted by students preparing for real exams</div>
                    <div className="mask-fade overflow-hidden">
                      <div className="animate-marquee flex w-max items-center">
                        {repeatedBrands.map((brand, index) => (
                          <BrandLogo key={`${brand.name}-${index}`} name={brand.name} gradient={brand.hue} />
                        ))}
                      </div>
                    </div>
                  </FadeInUp>
                </div>
              </section>

              <section id="features" className="px-6 py-24">
                <div className="mx-auto max-w-7xl space-y-24">
                  <div className="grid items-center gap-16 lg:grid-cols-2">
                    <FadeInUp>
                      <div>
                        <div className="mb-6 text-sm font-medium text-yellow-300">✨ AI chat</div>
                        <h2 className="text-4xl font-semibold tracking-tight text-white md:text-5xl">Ask Skeeme anything, then learn it deeply.</h2>
                        <p className="mt-6 max-w-xl text-lg leading-8 text-gray-300">
                          Get instant explanations for difficult questions, break down complex topics step by step,
                          and turn every study session into clear, actionable understanding without wasting time.
                        </p>
                        <button type="button" onClick={() => scrollToSection('contact')} className="mt-8 rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition hover:scale-[1.01]">Get started</button>
                      </div>
                    </FadeInUp>

                    <FadeInUp delay={100}>
                      <div className="relative overflow-hidden rounded-[28px] border border-white/10 bg-[#0b1220] p-8 shadow-glow">
                        <video autoPlay muted loop playsInline className="absolute inset-0 h-full w-full object-cover">
                          <source src="https://cdn.sceneai.art/Hero%20Section%20Video/1bcc8fa3-37f6-4c53-8591-0347e4c7f8ac.mp4" type="video/mp4" />
                        </video>
                        <div className="absolute inset-0 bg-black/20" />

                        <div className="relative rounded-2xl border border-white/10 bg-[#1C1C1E]/90 p-4 backdrop-blur-xl">
                          <div className="mb-5 flex items-center gap-2">
                            {['Create image', 'Generate code', 'Summarize'].map((chip) => (
                              <span key={chip} className="rounded-full border border-white/10 bg-white/5 px-2.5 py-1 text-[10px] text-gray-300">{chip}</span>
                            ))}
                          </div>

                          <div className="space-y-4">
                            <div className="rounded-2xl bg-white/5 p-3 text-sm text-gray-200">How can I optimize our onboarding flow for higher conversion rates?</div>
                            <div className="rounded-2xl bg-[#2F5EFF]/20 p-3 text-sm text-blue-100">I would start by reducing friction in the first 3 steps, clarifying value instantly, and using progressive profiling to improve completion.</div>
                          </div>

                          <div className="mt-5 flex items-center gap-3 rounded-2xl border border-white/10 bg-black/20 px-3 py-3 text-sm text-gray-400">
                            <span className="text-lg text-white">✦</span>
                            <span className="flex-1">Ask anything...</span>
                            <span className="rounded-full bg-white/5 p-2 text-xs text-gray-300">🎙</span>
                            <span className="rounded-full bg-white/5 p-2 text-xs text-gray-300">◎</span>
                          </div>
                        </div>
                      </div>
                    </FadeInUp>
                  </div>

                  <div className="grid items-center gap-16 lg:grid-cols-2">
                    <FadeInUp delay={80}>
                      <div className="relative overflow-hidden rounded-[28px] border border-white/10 bg-[#0b1220] p-8 shadow-glow">
                        <video autoPlay muted loop playsInline className="absolute inset-0 h-full w-full object-cover">
                          <source src="https://cdn.sceneai.art/Hero%20Section%20Video/736fd4a0-70ac-4f44-9633-55769ead6aca.mp4" type="video/mp4" />
                        </video>
                        <div className="absolute inset-0 bg-black/20" />

                        <div className="relative rounded-2xl border border-white/10 bg-[#1C1C1E]/90 p-4 backdrop-blur-xl">
                          <div className="mb-4 flex items-center justify-between text-sm text-gray-300">
                            <div className="flex items-center gap-3">
                              <span className="flex h-10 w-10 items-center justify-center rounded-full bg-white/10 text-lg">▶</span>
                              <div>
                                <div className="font-medium text-white">11:06 AM — Chris</div>
                                <div className="text-xs text-gray-400">Voice note transcription</div>
                              </div>
                            </div>
                            <span className="text-xs text-emerald-300">Live</span>
                          </div>

                          <div className="rounded-xl bg-black/20 p-3">
                            <div className="mb-3 flex h-16 items-center justify-center">
                              <div className="flex h-10 items-end gap-1">
                                {[...Array(16)].map((_, i) => (
                                  <span key={i} className="w-1 rounded-full bg-gradient-to-t from-cyan-500 to-emerald-400" style={{ height: `${12 + ((i * 7) % 34)}px` }} />
                                ))}
                              </div>
                            </div>
                            <p className="text-sm leading-6 text-gray-200">
                              “We’ve had strong customer feedback around the onboarding flow, but we still see friction in the quote request step. Let’s simplify that journey and surface the value faster.”
                            </p>
                          </div>
                        </div>
                      </div>
                    </FadeInUp>

                    <FadeInUp delay={120}>
                      <div>
                        <div className="mb-6 text-sm font-medium text-emerald-300">✨ AI notes</div>
                        <h2 className="text-4xl font-semibold tracking-tight text-white md:text-5xl">Turn class content into revision you can actually retain.</h2>
                        <p className="mt-6 max-w-xl text-lg leading-8 text-gray-300">
                          Convert lectures, recordings, and notes into organized study material, accurate summaries, and smart flashcards that make revision faster and far more effective.
                        </p>
                        <button type="button" onClick={() => scrollToSection('contact')} className="mt-8 rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition hover:scale-[1.01]">Get started</button>
                      </div>
                    </FadeInUp>
                  </div>
                </div>
              </section>

              <section id="faq" className="px-6 py-32">
                <div className="mx-auto max-w-3xl">
                  <FadeInUp className="mb-12 text-center">
                    <h2 className="text-4xl font-semibold tracking-tight text-white md:text-5xl">We've got answers</h2>
                  </FadeInUp>

                  <div className="overflow-hidden rounded-xl border border-white/10 bg-transparent">
                    {faqData.map((item, index) => {
                      const isOpen = activeFaq === index;
                      return (
                        <div key={item.question} className={index < faqData.length - 1 ? 'border-b border-white/10' : ''}>
                          <button type="button" onClick={() => setActiveFaq(isOpen ? -1 : index)} className="flex w-full items-center justify-between gap-4 px-6 py-6 text-left">
                            <span className="text-base font-medium text-white">{item.question}</span>
                            <span className={`flex h-6 w-6 items-center justify-center rounded-full border border-white/10 text-lg text-gray-300 transition-transform duration-300 ${isOpen ? 'rotate-45' : ''}`}>+</span>
                          </button>

                          <div className={`grid overflow-hidden transition-all duration-300 ease-out ${isOpen ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'}`}>
                            <div className="overflow-hidden">
                              <p className="px-6 pb-6 text-sm leading-6 text-gray-400">{item.answer}</p>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </section>
            </main>

            <footer id="contact" className="relative z-0 border-t border-white/5 px-6 pb-10 pt-32">
              <video autoPlay muted loop playsInline className="absolute inset-0 -z-10 h-full w-full object-cover opacity-40">
                <source src="https://cdn.sceneai.art/Hero%20Section%20Video/50b4f304-cdca-4e12-8735-580d225834be.mp4" type="video/mp4" />
              </video>
              <div className="absolute inset-0 -z-10 bg-gradient-to-b from-black via-black/60 to-black" />

              <div className="mx-auto max-w-7xl">
                <div className="mb-32 text-center">
                  <h2 className="text-4xl font-semibold tracking-tight text-white md:text-5xl">Ready to study <span className="font-serif italic font-normal">smarter?</span></h2>

                  <div className="mt-8 flex flex-col items-center justify-center gap-4 sm:flex-row">
                    <button type="button" onClick={() => scrollToSection('about')} className="rounded-full bg-white px-6 py-3.5 text-sm font-medium text-black transition hover:scale-[1.02]">Get started</button>
                    <button type="button" onClick={() => scrollToSection('features')} className="rounded-full border border-white/10 bg-[#1F1F22] px-6 py-3.5 text-sm font-medium text-white transition-colors hover:bg-[#2A2A2D]">Learn more</button>
                  </div>
                </div>

                <div className="mb-24 grid grid-cols-1 gap-8 md:grid-cols-4">
                  <div>
                    <div className="mb-4 flex items-center gap-3">
                      <LogoMark />
                      <span className="text-xl font-bold text-white">Skeeme</span>
                    </div>
                    <p className="text-sm text-gray-400">Snap, solve, revise, repeat.</p>
                  </div>

                  <div>
                    <h3 className="mb-4 text-sm font-medium uppercase tracking-[0.12em] text-gray-500">Product</h3>
                    <ul className="space-y-3 text-sm text-gray-400">
                      <li><button type="button" onClick={() => scrollToSection('about')} className="hover:text-white">About</button></li>
                      <li><button type="button" onClick={() => scrollToSection('features')} className="hover:text-white">Pricing</button></li>
                      <li><button type="button" onClick={() => scrollToSection('faq')} className="hover:text-white">Changelog</button></li>
                      <li><button type="button" onClick={() => scrollToSection('contact')} className="hover:text-white">Contact</button></li>
                    </ul>
                  </div>

                  <div>
                    <h3 className="mb-4 text-sm font-medium uppercase tracking-[0.12em] text-gray-500">Legal</h3>
                    <ul className="space-y-3 text-sm text-gray-400">
                      <li><button type="button" className="hover:text-white">Terms of service</button></li>
                      <li><button type="button" className="hover:text-white">Privacy policy</button></li>
                      <li><button type="button" className="hover:text-white">404</button></li>
                    </ul>
                  </div>

                  <div>
                    <h3 className="mb-4 text-sm font-medium uppercase tracking-[0.12em] text-gray-500">Connect</h3>
                    <ul className="space-y-3 text-sm text-gray-400">
                      <li><button type="button" className="hover:text-white">Instagram</button></li>
                      <li><button type="button" className="hover:text-white">YouTube</button></li>
                      <li><button type="button" className="hover:text-white">LinkedIn</button></li>
                      <li><button type="button" className="hover:text-white">Twitter / X</button></li>
                    </ul>
                  </div>
                </div>

                <div className="flex flex-col items-center justify-center gap-4 border-t border-white/5 pt-8 text-center text-xs text-gray-500 md:flex-row">
                  <span>© 2026 Skeeme.</span>
                  <span>All rights reserved.</span>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
