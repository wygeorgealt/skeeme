<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skeeme — Study with confidence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400;17..18,500;17..18,700&family=Google+Sans+Text:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">
    <meta name="description" content="Skeeme helps students study smarter with AI-powered revision, practice questions, and exam prep." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              glow: '0 0 30px rgba(0, 122, 255, 0.25)',
            },
          },
        },
      };
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { background: #f9fbff; color: #17212b; }
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      ::selection { background: #007aff; color: #fff; }
    </style>
  </head>
  <body class="bg-[#f9fbff] text-[#17212b] antialiased selection:bg-[#1688f5] selection:text-white">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- Legacy concept retained as reference only; the live landing page is rendered below. -->
    <script type="text/plain" id="legacy-landing-page">
      const { useEffect, useState } = React;

      const LucideIcons = window.lucideReact || {};
      const PlusIcon = LucideIcons.Plus || (({ className = '', strokeWidth = 1.5 }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M12 5v14M5 12h14" />
        </svg>
      ));
      const MinusIcon = LucideIcons.Minus || (({ className = '', strokeWidth = 1.5 }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M5 12h14" />
        </svg>
      ));
      const SparklesIcon = LucideIcons.Sparkles || (({ className = '', strokeWidth = 1.5 }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z" />
          <path d="m19 14 0.7 1.9L21.5 17l-1.8 1.1L19 20l-0.7-1.9L16.5 17l1.8-1.1L19 14Z" />
        </svg>
      ));
      const ArrowRightIcon = LucideIcons.ArrowRight || (({ className = '', strokeWidth = 1.5 }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M5 12h14" />
          <path d="m13 5 7 7-7 7" />
        </svg>
      ));
      const BookOpenCheckIcon = LucideIcons.BookOpenCheck || (({ className = '', strokeWidth = 1.5 }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M4 19V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14" />
          <path d="M4 19a2 2 0 0 0 2 2h12" />
          <path d="m8 10 2 2 4-4" />
        </svg>
      ));
      const BrainCircuitIcon = LucideIcons.BrainCircuit || (({ className = '', strokeWidth = 1.5 }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M9 3a3 3 0 0 0-3 3v1.5A2.5 2.5 0 0 1 3.5 10H5a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H3.5A2.5 2.5 0 0 1 1 11.5V10a3 3 0 0 0 3-3V7a3 3 0 0 1 3-3h2Z" />
          <path d="M15 3a3 3 0 0 1 3 3v1.5A2.5 2.5 0 0 0 20.5 10H19a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h1.5A2.5 2.5 0 0 0 23 11.5V10a3 3 0 0 1 3 3v1" />
          <path d="M12 5v14" />
          <path d="M8 9h8" />
          <path d="M8 15h8" />
        </svg>
      ));

      const faqs = [
        { question: 'How do I start preparing with Skeeme?', answer: "Just download the app and choose the subjects you want to master. You'll get a quick placement check to see where you stand, then Skeeme builds a personalized study plan with AI-generated practice questions targeting your weak areas." },
        { question: 'How can i track my progress on Skeeme?', answer: "Your dashboard shows subject-by-subject performance, streaks, and predicted scores based on your practice history. You can drill into any topic to see exactly where you're losing marks and what to review next." },
        { question: 'What can I study with Skeeme?', answer: 'Skeeme supports every subject you are learning, with AI-powered questions, explanations, and revision tools that adapt to your materials and goals.' },
        { question: 'How long before I see improvement?', answer: 'It depends on your starting point and how consistently you practice, but most students notice clearer topic mastery within a few weeks of daily use, especially once the AI starts targeting their specific weak spots.' },
        { question: 'Do you offer offline access for low-connectivity areas?', answer: "Yes. Core practice sets and previously loaded content are available offline, so you can keep studying even without a stable connection, with progress syncing automatically once you're back online." }
      ];

      const navItems = [
        { label: 'About', id: 'about' },
        { label: 'Features', id: 'features' },
        { label: 'FAQ', id: 'faq' },
        { label: 'Contact', id: 'contact' },
      ];

      const trustItems = ['Quizzes', 'Flashcards', 'Scan notes', 'Exam prep', 'Streaks'];

      function AnimatedText({ text, delayOffset = 0, wordDelay = 70, className = '' }) {
        const words = text.split(' ');
        return (
          <span className={className}>
            {words.map((word, index) => (
              <React.Fragment key={`${word}-${index}`}>
                <span
                  className="inline-block"
                  style={{
                    opacity: 0,
                    animation: 'fadeUp 0.7s ease forwards',
                    animationDelay: `${delayOffset + index * wordDelay}ms`,
                  }}
                >
                  {word}
                </span>
                {index < words.length - 1 ? ' ' : null}
              </React.Fragment>
            ))}
          </span>
        );
      }

      function FeaturePill({ label }) {
        return (
          <div className="flex shrink-0 items-center gap-3 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-gray-300 backdrop-blur-sm">
            <span className="inline-flex h-2.5 w-2.5 rounded-full bg-[#007aff]" />
            <span>{label}</span>
          </div>
        );
      }

      function AppMockup({ type = 'chat' }) {
        if (type === 'chat') {
          return (
            <div className="mx-auto w-full max-w-[420px] rounded-[32px] border border-white/10 bg-[#0b1320] p-3 shadow-[0_30px_80px_rgba(0,122,255,0.22)]">
              <div className="rounded-[28px] border border-slate-200 bg-[#f5f7fb] p-4 text-slate-900">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="flex h-8 w-8 items-center justify-center rounded-xl bg-[#dfe8ff] p-1">
                      <span className="text-sm font-bold text-[#007aff]">S</span>
                    </div>
                    <div>
                      <div className="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-400">Skeeme</div>
                      <div className="text-sm font-semibold">Ask anything</div>
                    </div>
                  </div>
                  <div className="rounded-full bg-emerald-100 px-2 py-1 text-[10px] font-semibold text-emerald-700">Live</div>
                </div>
                <div className="mt-4 rounded-2xl bg-[#e8edf9] p-3">
                  <div className="mb-3 flex items-center gap-2 text-[10px] font-medium text-slate-500">
                    <span className="rounded-full bg-white px-2 py-1">Biology</span>
                    <span className="rounded-full bg-white px-2 py-1">Revision</span>
                  </div>
                  <div className="rounded-2xl bg-white p-3 shadow-sm">
                    <div className="text-[11px] font-medium text-slate-500">Question</div>
                    <div className="mt-2 text-sm font-medium leading-6 text-slate-800">Explain the process of photosynthesis in simple terms and show me how I should revise it.</div>
                  </div>
                </div>
                <div className="mt-3 rounded-2xl bg-[#dfe8ff] p-3">
                  <div className="text-[11px] font-medium text-blue-700">Skeeme AI</div>
                  <div className="mt-2 text-sm leading-6 text-slate-800">Plants turn carbon dioxide and water into glucose and oxygen using light energy. For revision, remember the key stages: light-dependent reactions, ATP production, and the Calvin cycle.</div>
                </div>
                <div className="mt-4 flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-3 py-2">
                  <span className="text-lg text-slate-400">✦</span>
                  <span className="flex-1 text-sm text-slate-500">Ask Skeeme anything...</span>
                  <span className="rounded-full bg-slate-100 px-2 py-1 text-xs text-slate-600">Mic</span>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className="mx-auto w-full max-w-[420px] rounded-[32px] border border-white/10 bg-[#0b1320] p-3 shadow-[0_30px_80px_rgba(16,185,129,0.18)]">
            <div className="rounded-[28px] border border-slate-200 bg-[#f5f7fb] p-4 text-slate-900">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="flex h-8 w-8 items-center justify-center rounded-xl bg-[#e4f7ee] p-1">
                    <span className="text-sm font-bold text-[#007aff]">S</span>
                  </div>
                  <div>
                    <div className="text-[10px] font-semibold uppercase tracking-[0.18em] text-slate-400">Skeeme</div>
                    <div className="text-sm font-semibold">Revision mode</div>
                  </div>
                </div>
                <div className="rounded-full bg-emerald-100 px-2 py-1 text-[10px] font-semibold text-emerald-700">Synced</div>
              </div>
              <div className="mt-4 rounded-2xl bg-[#ecf2ff] p-3">
                <div className="flex items-center justify-between text-[11px] text-slate-600">
                  <span>Lecture summary</span>
                  <span>6 mins</span>
                </div>
                <div className="mt-3 h-2.5 overflow-hidden rounded-full bg-white">
                  <div className="h-full w-[78%] rounded-full bg-gradient-to-r from-[#007aff] to-[#5eead4]" />
                </div>
              </div>
              <div className="mt-4 space-y-3">
                <div className="rounded-2xl bg-white p-3 shadow-sm">
                  <div className="text-[11px] font-medium uppercase tracking-[0.18em] text-slate-400">Flashcards</div>
                  <div className="mt-2 text-sm font-medium text-slate-800">What is the main function of ATP in respiration?</div>
                </div>
                <div className="rounded-2xl bg-[#e9fff5] p-3 shadow-sm">
                  <div className="text-[11px] font-medium uppercase tracking-[0.18em] text-emerald-700">Answer</div>
                  <div className="mt-2 text-sm leading-6 text-slate-800">ATP stores and transfers energy for biochemical reactions inside the cell.</div>
                </div>
              </div>
              <div className="mt-4 grid grid-cols-3 gap-2 text-center text-[10px] font-medium text-slate-600">
                <div className="rounded-xl bg-white p-2 shadow-sm">Quiz</div>
                <div className="rounded-xl bg-white p-2 shadow-sm">Recall</div>
                <div className="rounded-xl bg-white p-2 shadow-sm">Spaced</div>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [isScrolled, setIsScrolled] = useState(false);
        const [mobileOpen, setMobileOpen] = useState(false);
        const [activeFaq, setActiveFaq] = useState(0);

        useEffect(() => {
          const onScroll = () => setIsScrolled(window.scrollY > 20);
          onScroll();
          window.addEventListener('scroll', onScroll, { passive: true });
          return () => window.removeEventListener('scroll', onScroll);
        }, []);

        const scrollToSection = (id) => {
          const element = document.getElementById(id);
          if (element) {
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        };

        return (
          <div className="min-h-screen overflow-x-hidden bg-[#050b17] text-white">
            <header className={`fixed inset-x-0 top-0 z-50 transition-all duration-500 ${isScrolled ? 'bg-black/80 backdrop-blur-md' : 'bg-transparent'}`}>
              <div className="mx-auto max-w-7xl px-6">
                <div className={`mt-5 flex items-center justify-between rounded-full border border-white/10 px-4 py-3 transition-all duration-300 ${isScrolled ? 'bg-[#0b1320]/80' : 'bg-transparent'}`}>
                  <button type="button" onClick={() => scrollToSection('about')} className="flex items-center gap-3">
                    <div className="flex h-8 w-8 items-center justify-center rounded-xl bg-[#007aff] text-sm font-bold text-white">S</div>
                    <span className="text-lg font-semibold tracking-tight text-white">Skeeme</span>
                  </button>

                  <nav className="hidden items-center gap-8 md:flex">
                    {navItems.map((item) => (
                      <button key={item.id} type="button" onClick={() => scrollToSection(item.id)} className="text-sm font-medium text-gray-300 transition-colors hover:text-white">
                        {item.label}
                      </button>
                    ))}
                  </nav>

                  <div className="hidden md:block">
                    <button type="button" onClick={() => scrollToSection('contact')} className="rounded-full border border-white/5 bg-[#1F1F22] px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-[#2A2A2D]">
                        Contact Us
                    </button>
                  </div>

                  <button type="button" aria-label="Toggle menu" aria-expanded={mobileOpen} onClick={() => setMobileOpen((value) => !value)} className="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-white/5 text-lg text-white md:hidden">
                    {mobileOpen ? '×' : '☰'}
                  </button>
                </div>

                <div className={`overflow-hidden transition-all duration-300 md:hidden ${mobileOpen ? 'max-h-80 opacity-100' : 'max-h-0 opacity-0'}`}>
                  <div className="mt-2 rounded-2xl border border-white/10 bg-black/60 p-3 backdrop-blur-md">
                    {navItems.map((item) => (
                      <button key={item.id} type="button" onClick={() => { scrollToSection(item.id); setMobileOpen(false); }} className="block w-full rounded-xl px-3 py-2 text-left text-sm text-gray-200 transition-colors hover:bg-white/5 hover:text-white">
                        {item.label}
                      </button>
                    ))}
                    <button type="button" onClick={() => { scrollToSection('contact'); setMobileOpen(false); }} className="mt-2 w-full rounded-full bg-[#1F1F22] px-4 py-2.5 text-sm font-medium text-white">
                      Get started
                    </button>
                  </div>
                </div>
              </div>
            </header>

            <main>
              <section id="about" className="relative z-0 min-h-screen pt-32 pb-20">
                <video autoPlay muted loop playsInline className="absolute inset-0 -z-10 h-full w-full object-cover opacity-90">
                  <source src="https://cdn.sceneai.art/Hero%20Section%20Video/50b4f304-cdca-4e12-8735-580d225834be.mp4" type="video/mp4" />
                </video>
                <div className="absolute inset-0 -z-10 bg-gradient-to-b from-black/30 via-transparent to-black" />

                <div className="mx-auto max-w-7xl px-6">
                  <div className="flex justify-center">
                    <div className="mb-8 inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-gray-300 backdrop-blur-sm">
                      <SparklesIcon className="h-3.5 w-3.5 text-[#7cc3ff]" strokeWidth={2} />
                      <span>AI study companion for students</span>
                    </div>
                  </div>

                  <div className="text-center">
                    <h1 className="text-5xl font-medium tracking-tight text-white md:text-7xl">
                      <span className="block">A smarter way to study.</span>
                      <span className="block text-white/95">With <span className="font-serif italic font-normal text-white/95">AI that actually helps.</span></span>
                    </h1>
                  </div>

                  <div className="mt-6 flex justify-center">
                    <p className="max-w-2xl text-center text-[16px] leading-8 text-gray-400">
                      Skeeme turns class notes, questions, and lecture content into instant explanations, revision prompts, and study systems you can actually use.
                    </p>
                  </div>

                  <div className="mt-10 flex justify-center gap-4">
                    <button type="button" onClick={() => scrollToSection('contact')} className="rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition hover:scale-[1.01]">Get started</button>
                    <button type="button" onClick={() => scrollToSection('features')} className="rounded-full border border-white/5 bg-[#1F1F22] px-6 py-3 text-sm font-medium text-white transition-colors hover:bg-[#2A2A2D]">Learn more</button>
                  </div>

                  <div className="mt-24">
                    <div className="mb-8 text-center text-sm font-medium text-gray-500">Built for the way students study</div>
                    <div className="overflow-hidden [mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,1)_8%,rgba(0,0,0,1)_92%,transparent)]">
                      <div className="flex w-max items-center gap-4 px-2">
                        {trustItems.concat(trustItems).concat(trustItems).concat(trustItems).map((label, index) => (
                          <FeaturePill key={`${label}-${index}`} label={label} />
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <section id="features" className="px-6 py-24">
                <div className="mx-auto max-w-7xl space-y-24">
                  <div className="grid items-center gap-16 lg:grid-cols-2">
                    <div>
                      <div className="mb-6 text-sm font-medium text-yellow-300">✨ AI chat</div>
                      <h2 className="text-4xl font-semibold tracking-tight text-white md:text-5xl">Ask Skeeme anything, then learn it deeply.</h2>
                      <p className="mt-6 max-w-xl text-lg leading-8 text-gray-300">Get instant explanations for the questions you’re stuck on, from simple definitions to deeper concept breakdowns, without bouncing between tabs or textbooks.</p>
                      <button type="button" onClick={() => scrollToSection('contact')} className="mt-8 rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition hover:scale-[1.01]">Get started</button>
                    </div>
                    <div className="relative overflow-hidden rounded-[28px] border border-white/10 bg-[#0b1220] p-8 shadow-glow">
                      <video autoPlay muted loop playsInline className="absolute inset-0 h-full w-full object-cover">
                        <source src="https://cdn.sceneai.art/Hero%20Section%20Video/1bcc8fa3-37f6-4c53-8591-0347e4c7f8ac.mp4" type="video/mp4" />
                      </video>
                      <div className="absolute inset-0 bg-black/15" />
                      <div className="relative flex h-full items-center justify-center">
                        <AppMockup type="chat" />
                      </div>
                    </div>
                  </div>

                  <div className="grid items-center gap-16 lg:grid-cols-2">
                    <div className="relative overflow-hidden rounded-[28px] border border-white/10 bg-[#0b1220] p-8 shadow-glow">
                      <video autoPlay muted loop playsInline className="absolute inset-0 h-full w-full object-cover">
                        <source src="https://cdn.sceneai.art/Hero%20Section%20Video/736fd4a0-70ac-4f44-9633-55769ead6aca.mp4" type="video/mp4" />
                      </video>
                      <div className="absolute inset-0 bg-black/15" />
                      <div className="relative flex h-full items-center justify-center">
                        <AppMockup type="revision" />
                      </div>
                    </div>
                    <div>
                      <div className="mb-6 text-sm font-medium text-emerald-300">✨ AI revision</div>
                      <h2 className="text-4xl font-semibold tracking-tight text-white md:text-5xl">Turn class content into revision you can actually retain.</h2>
                      <p className="mt-6 max-w-xl text-lg leading-8 text-gray-300">Let Skeeme turn lecture notes, voice recordings, and study material into personalized flashcards, summaries, and daily revision prompts that stick.</p>
                      <button type="button" onClick={() => scrollToSection('contact')} className="mt-8 rounded-full bg-white px-6 py-3 text-sm font-medium text-black transition hover:scale-[1.01]">Get started</button>
                    </div>
                  </div>
                </div>
              </section>

              <section id="faq" className="bg-[#050b17] px-6 py-24 md:py-32">
                <div className="mx-auto max-w-[1440px] px-0 md:px-12 lg:px-24">
                  <div className="grid grid-cols-1 gap-8 lg:grid-cols-12 lg:gap-16">
                    <div className="lg:col-span-4 mt-2 lg:mt-4">
                      <div className="flex items-center gap-3">
                        <span className="block h-[6px] w-[6px] rounded-sm bg-[#007aff]" />
                        <span className="text-sm font-semibold tracking-[0.08em] uppercase text-white">
                          <AnimatedText text="ABOUT SKEEME" delayOffset={0} wordDelay={80} />
                        </span>
                      </div>
                    </div>

                    <div className="lg:col-span-8 w-full max-w-[54rem]">
                      <h2 className="mb-16 lg:mb-24 text-4xl font-medium tracking-tight leading-[1.05] text-white md:text-5xl lg:text-7xl">
                        <AnimatedText text="Frequently asked questions" delayOffset={120} wordDelay={75} />
                      </h2>

                      <div>
                        {faqs.map((faq, index) => {
                          const isOpen = activeFaq === index;
                          return (
                            <div key={faq.question} className="border-b border-dashed border-white/30">
                              <button
                                type="button"
                                className="group flex w-full items-center justify-between py-6 text-left md:py-8"
                                onClick={() => setActiveFaq(isOpen ? -1 : index)}
                                aria-expanded={isOpen}
                              >
                                <span className="text-xl font-medium tracking-tight leading-snug text-white transition-opacity group-hover:opacity-70 md:text-[1.7rem]">
                                  {faq.question}
                                </span>
                                <span className="ml-6 flex-shrink-0 text-white">
                                  {isOpen ? (
                                    <MinusIcon className="h-6 w-6 md:h-7 md:w-7" strokeWidth={1.5} />
                                  ) : (
                                    <PlusIcon className="h-6 w-6 md:h-7 md:w-7" strokeWidth={1.5} />
                                  )}
                                </span>
                              </button>

                              <div className={`grid transition-all duration-[400ms] ease-in-out ${isOpen ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
                                <div className="overflow-hidden">
                                  {index === 0 ? (
                                    <div className="pb-8 pr-4 text-base leading-relaxed text-slate-300 md:pb-10 md:pr-12 md:text-lg">
                                      <AnimatedText text={faq.answer} delayOffset={220} wordDelay={22} />
                                    </div>
                                  ) : (
                                    <p className="pb-8 pr-4 text-base leading-relaxed text-slate-300 md:pb-10 md:pr-12 md:text-lg">
                                      {faq.answer}
                                    </p>
                                  )}
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            </main>

            <footer id="contact" className="relative z-0 border-t border-white/5 px-6 pb-10 pt-32">
              <video autoPlay muted loop playsInline className="absolute inset-0 -z-10 h-full w-full object-cover opacity-40">

    <script>
      const motionTargets = document.querySelectorAll('#root.md3 section.standard, #root.md3 .ctabox, #root.md3 .feature, #root.md3 .plan');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      motionTargets.forEach((element) => element.classList.add('reveal'));
      if (reducedMotion) {
        motionTargets.forEach((element) => element.classList.add('is-visible'));
      } else {
        const observer = new IntersectionObserver((entries, currentObserver) => entries.forEach((entry) => {
          if (entry.isIntersecting) { entry.target.classList.add('is-visible'); currentObserver.unobserve(entry.target); }
        }), { threshold: 0.14 });
        motionTargets.forEach((element) => observer.observe(element));
      }

      @media(prefers-reduced-motion:reduce){#root.md3 .hero h1 .typing-caret::after{animation:none}#root.md3 .floating-ui{display:none}}
    </style>
    <script>
      (() => {
        const root = document.querySelector('#root.md3');
        const hero = root?.querySelector('.hero');
        const heading = hero?.querySelector('h1');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (heading && !reduced) {
          heading.innerHTML = '<span class="typing-line" aria-label="Study with clarity."></span><span class="typing-line accent typing-caret" aria-label="Show up with confidence."></span>';
          const lines = [
            { node: heading.children[0], text: 'Study with clarity.' },
            { node: heading.children[1], text: 'Show up with confidence.' }
          ];
          let line = 0, letter = 0;
          const type = () => {
            const current = lines[line];
            current.node.textContent = current.text.slice(0, ++letter);
            if (letter < current.text.length) { setTimeout(type, 42); return; }
            current.node.classList.remove('typing-caret');
            line += 1; letter = 0;
            if (line < lines.length) setTimeout(type, 180);
          };
          setTimeout(type, 250);
        }

        if (!hero || reduced) return;
        const floatingMarkup = [];
        if (!floatingMarkup.length) return;
        const elements = floatingMarkup.map(([className, html, x, y], index) => {
          const node = document.createElement('div');
          node.className = 'floating-ui floating-hidden ' + className;
          node.innerHTML = html;
          node.style.left = '0px'; node.style.top = '0px';
          hero.appendChild(node);
          return { node, x, y, baseX: 0, baseY: 0, dx: 0, dy: 0, phase: index * 1.7 };
        });
        const pointer = { x: -9999, y: -9999 };
        hero.addEventListener('pointermove', (event) => {
          const box = hero.getBoundingClientRect();
          pointer.x = event.clientX - box.left; pointer.y = event.clientY - box.top;
        });
        hero.addEventListener('pointerleave', () => { pointer.x = -9999; pointer.y = -9999; });
        const place = () => {
          const box = hero.getBoundingClientRect();
          elements.forEach((item) => {
            item.baseX = Math.max(18, Math.min(box.width - item.node.offsetWidth - 18, box.width * item.x));
            item.baseY = Math.max(24, Math.min(box.height - item.node.offsetHeight - 24, box.height * item.y));
            item.node.classList.remove('floating-hidden');
          });
        };
        addEventListener('resize', place, { passive: true });
        requestAnimationFrame(place);
        let last = performance.now();
        const animate = (now) => {
          const time = now / 1000, dt = Math.min((now - last) / 16.7, 2); last = now;
          elements.forEach((item) => {
            const box = item.node.getBoundingClientRect();
            const heroBox = hero.getBoundingClientRect();
            const cx = box.left - heroBox.left + box.width / 2, cy = box.top - heroBox.top + box.height / 2;
            const px = cx - pointer.x, py = cy - pointer.y, distance = Math.hypot(px, py);
            if (distance < 150 && distance > 0) {
              const force = (150 - distance) / 150 * 2.2;
              item.dx += (px / distance) * force; item.dy += (py / distance) * force;
            }
            item.dx *= Math.pow(.88, dt); item.dy *= Math.pow(.88, dt);
            const driftX = Math.sin(time * .72 + item.phase) * 8;
            const driftY = Math.cos(time * .58 + item.phase) * 7;
            const nextX = Math.max(12, Math.min(heroBox.width - box.width - 12, item.baseX + driftX + item.dx * 20));
            const nextY = Math.max(16, Math.min(heroBox.height - box.height - 16, item.baseY + driftY + item.dy * 20));
            item.node.style.transform = 'translate3d(' + nextX + 'px,' + nextY + 'px,0)';
          });
          requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      })();
    </script>
