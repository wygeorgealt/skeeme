<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact — Skeeme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0;background:#f9fbff;color:#17212b}</style>
  </head>
  <body>
    <main class="mx-auto max-w-2xl p-6">
      <h1 class="text-2xl font-semibold mb-4">Contact Skeeme</h1>
      <p class="mb-4 text-sm text-gray-600">Send us a message and we'll get back as soon as we can.</p>

      <form id="contactForm" class="space-y-4 bg-white p-6 rounded-lg shadow-sm">
        <div>
          <label class="block text-sm font-medium">Name (optional)</label>
          <input name="name" class="mt-1 w-full rounded-md border px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">Email</label>
          <input name="email" type="email" required class="mt-1 w-full rounded-md border px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">Message</label>
          <textarea name="message" required rows="6" class="mt-1 w-full rounded-md border px-3 py-2"></textarea>
        </div>
        <div class="flex items-center justify-between">
          <button id="submitBtn" class="rounded bg-blue-600 text-white px-4 py-2">Send message</button>
          <div id="status" class="text-sm text-gray-600"></div>
        </div>
      </form>

      <p class="mt-6 text-xs text-gray-500">By sending a message you agree to our <a href="/privacy" class="text-blue-600">privacy policy</a>.</p>
    </main>

    <script>
      // Simple client-side rate limit (5 submissions per hour per browser)
      const LIMIT = 5;
      const KEY = 'contact_submissions';

      function canSubmit(){
        try{
          const raw = localStorage.getItem(KEY);
          const list = raw ? JSON.parse(raw) : [];
          const now = Date.now();
          const hourAgo = now - 60*60*1000;
          const recent = list.filter(t=>t>hourAgo);
          return {allowed: recent.length < LIMIT, recent};
        }catch(e){return {allowed:true, recent:[]}}
      }

      function recordSubmit(){
        try{
          const raw = localStorage.getItem(KEY);
          const list = raw ? JSON.parse(raw) : [];
          list.push(Date.now());
          localStorage.setItem(KEY, JSON.stringify(list));
        }catch(e){}
      }

      document.getElementById('contactForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const {allowed} = canSubmit();
        if(!allowed){ status.textContent = 'Rate limit exceeded. Try again later.'; return; }
        submitBtn.disabled = true; status.textContent = 'Sending…';
        const form = e.target;
        const body = { name: form.name.value, email: form.email.value, message: form.message.value };
        try{
          const res = await fetch('/send-contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if(res.ok){ recordSubmit(); status.textContent = 'Thanks — we received your message.'; form.reset(); }
          else{
            const json = await res.json().catch(()=>null);
            status.textContent = (json && json.error) || (await res.text()) || 'Submission failed';
          }
        }catch(err){ status.textContent = 'Network error'; }
        submitBtn.disabled = false;
      });
    </script>
  </body>
</html>
