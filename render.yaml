services:
  - type: web
    name: skeeme-web
    env: docker
    plan: free
    region: ohio
    envVars:
      - key: APP_NAME
        value: Skeeme
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr # Force logs to console
      - key: APP_URL
        sync: false # e.g. https://skeeme.com
      - key: WEBROOT
        value: /var/www/html/public
      - key: PHP_ERRORS_STDERR
        value: "1"
      - key: RUN_SCRIPTS
        value: "1"
      
      # Database (Aiven)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "27463"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      
      # SSL for Aiven
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: false
      
      # Storage (Cloudflare R2)
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: false

      # Mail (Mailtrap or other)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: sandbox.smtp.mailtrap.io
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: hello@skeeme.com
      - key: MAIL_FROM_NAME
        value: "Skeeme Team"

      # Paystack
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      
      # Google Integration
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # e.g. https://skeeme.com/integrations/google/callback

      # Recaptcha
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false

      # Africa's Talking
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false

      # Application Secrets
      - key: APP_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false

      # System Stability (Use Redis for Queues/Cache in production)
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: skeeme-redis
          property: connectionString

  - type: worker
    name: skeeme-worker
    env: docker
    plan: free
    region: ohio
    startCommand: "php artisan queue:work --queue=default"
    envVars:
      - fromService:
          name: skeeme-web
          type: web
      - key: REDIS_URL
        fromService:
          type: redis
          name: skeeme-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: RUN_SCRIPTS
        value: "0" # Don't run migrations in the worker, only in the web service

  - type: redis
    name: skeeme-redis
    region: ohio
    plan: free # Use 'starter' for persistence and larger memory
    ipAllowList: [] # Internal access only
