services:
  - type: web
    name: skeeme-web
    env: docker
    plan: free
    region: ohio
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://skeeme.com # Update this to your Render URL if different
      - key: WEBROOT
        value: /var/www/html/public
      - key: PHP_ERRORS_STDERR
        value: "1"
      - key: RUN_SCRIPTS
        value: "1"
      
      # Database (Aiven)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false # Enter Aiven Host
      - key: DB_PORT
        value: "27463" # From your screenshot
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false # Enter Aiven Password
      
      # SSL for Aiven
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      
      # Storage (Cloudflare R2)
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false # e.g. https://<id>.r2.cloudflarestorage.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: false

      # Application Secrets
      - key: APP_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
